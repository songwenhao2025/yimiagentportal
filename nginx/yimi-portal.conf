# =============================================================================
# 壹米 AI Agent 门户 — Nginx 反向代理配置（生产/测试环境）
# =============================================================================
#
# 用途：
#   1) 静态托管前端（uni-app 打包后的 H5 产物）
#   2) 把 /api/* 按前缀反向代理到 7 个后端微服务
#
# 部署前需替换的占位：
#   - server_name:   改为实际域名或主机名
#   - root:          改为前端静态资源路径（uni-app 默认为 dist/build/h5/）
#   - 上游 host:     如果后端不在同一台机器，把下面 upstream 里的 127.0.0.1 改成实际地址
#   - HTTPS:         上线后请增加 listen 443 ssl + ssl_certificate / ssl_certificate_key
#
# 测试方式：
#   sudo nginx -t -c /etc/nginx/nginx.conf      # 语法校验
#   sudo nginx -s reload                         # 重新加载
# =============================================================================

# -------- 上游后端服务（7 个微服务） --------
upstream yimi_auth      { server 127.0.0.1:8081; keepalive 32; }
upstream yimi_agent     { server 127.0.0.1:8082; keepalive 32; }
upstream yimi_skill     { server 127.0.0.1:8083; keepalive 32; }
upstream yimi_workflow  { server 127.0.0.1:8084; keepalive 32; }
upstream yimi_knowledge { server 127.0.0.1:8085; keepalive 32; }
upstream yimi_admin     { server 127.0.0.1:8086; keepalive 32; }
upstream yimi_llm       { server 127.0.0.1:8087; keepalive 32; }

# -------- 公共代理参数 --------
# 通过 include 复用，避免在每个 location 里重复
# 实际部署时将本片段保存到 /etc/nginx/snippets/yimi-proxy.conf 后 include 即可。
# 为了可读性，本文件直接重复书写。

server {
    listen 80;
    server_name _;        # TODO: 替换为实际域名，例如 portal.yimi.example.com

    # 静态资源根目录：uni-app build:h5 默认输出到 dist/build/h5/
    root /var/www/yimi-portal/h5;
    index index.html;

    # 文件上传上限（知识库可能上传大文档）
    client_max_body_size 50m;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 静态资源带哈希文件名 -> 长缓存
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ---------- /api/* 反向代理（按前缀路由到对应服务） ----------
    # 注意：SPA fallback 必须放在所有 /api 规则之后，避免吞掉 API 请求。

    location /api/auth/    { proxy_pass http://yimi_auth;      include /etc/nginx/snippets/yimi-proxy.conf; }
    location /api/users/   { proxy_pass http://yimi_auth;      include /etc/nginx/snippets/yimi-proxy.conf; }

    location /api/agents              { proxy_pass http://yimi_agent;     include /etc/nginx/snippets/yimi-proxy.conf; }
    location /api/agents/             { proxy_pass http://yimi_agent;     include /etc/nginx/snippets/yimi-proxy.conf; }
    location /api/agent-call-logs/    { proxy_pass http://yimi_agent;     include /etc/nginx/snippets/yimi-proxy.conf; }

    location /api/skills/             { proxy_pass http://yimi_skill;     include /etc/nginx/snippets/yimi-proxy.conf; }

    location /api/workflows           { proxy_pass http://yimi_workflow;  include /etc/nginx/snippets/yimi-proxy.conf; }
    location /api/workflows/          { proxy_pass http://yimi_workflow;  include /etc/nginx/snippets/yimi-proxy.conf; }
    location /api/workflow-executions/{ proxy_pass http://yimi_workflow;  include /etc/nginx/snippets/yimi-proxy.conf; }

    location /api/knowledge/          { proxy_pass http://yimi_knowledge; include /etc/nginx/snippets/yimi-proxy.conf; }

    location /api/admin/              { proxy_pass http://yimi_admin;     include /etc/nginx/snippets/yimi-proxy.conf; }

    # LLM 接口需要长连接（流式响应），单独放宽超时
    location /api/llm/ {
        proxy_pass http://yimi_llm;
        include /etc/nginx/snippets/yimi-proxy.conf;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;        # 流式输出关闭缓冲
    }

    # ---------- SPA 路由 fallback（必须放最后） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查（运维用）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
