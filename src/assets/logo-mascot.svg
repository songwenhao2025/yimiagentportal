<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B8E4F0"/>
      <stop offset="100%" stop-color="#7EC8E3"/>
    </linearGradient>
    <linearGradient id="faceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="200" height="200" fill="white"/>
  
  <ellipse cx="100" cy="145" rx="55" ry="40" fill="url(#bodyGradient)" stroke="#5BA3C0" stroke-width="2"/>
  
  <text x="100" y="152" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1E3A5F" text-anchor="middle">1</text>
  
  <circle cx="100" cy="75" r="45" fill="url(#faceGradient)" stroke="#1E3A5F" stroke-width="3"/>
  
  <circle cx="100" cy="75" r="35" fill="none" stroke="#1E3A5F" stroke-width="1"/>
  <circle cx="100" cy="75" r="25" fill="none" stroke="#1E3A5F" stroke-width="1"/>
  
  <line x1="100" y1="75" x2="100" y2="50" stroke="#1E3A5F" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="75" x2="115" y2="70" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"/>
  
  <g transform="translate(30, 0)">
    <circle cx="100" cy="75" r="8" fill="#FFB6C1" opacity="0.7"/>
  </g>
  <g transform="translate(-30, 0)">
    <circle cx="100" cy="75" r="8" fill="#FFB6C1" opacity="0.7"/>
  </g>
  
  <path d="M 75 65 Q 85 80 95 65" fill="none" stroke="#1E3A5F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 105 65 Q 115 80 125 65" fill="none" stroke="#1E3A5F" stroke-width="2.5" stroke-linecap="round"/>
  
  <line x1="100" y1="30" x2="100" y2="10" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"/>
  
  <g filter="url(#glow)">
    <circle cx="100" cy="5" r="8" fill="url(#sparkleGlow)"/>
    <polygon points="100,0 102,6 108,8 102,10 100,16 98,10 92,8 98,6" fill="#FFD700"/>
    <circle cx="97" cy="2" r="3" fill="#FFED4A"/>
    <circle cx="103" cy="4" r="2" fill="#FFED4A"/>
    <circle cx="96" cy="7" r="2" fill="#FFED4A"/>
  </g>
  
  <ellipse cx="70" cy="130" rx="8" ry="12" fill="url(#bodyGradient)" stroke="#5BA3C0" stroke-width="1.5" transform="rotate(-15 70 130)"/>
  <ellipse cx="130" cy="130" rx="8" ry="12" fill="url(#bodyGradient)" stroke="#5BA3C0" stroke-width="1.5" transform="rotate(15 130 130)"/>
  
  <ellipse cx="75" cy="175" rx="10" ry="6" fill="#1E3A5F" opacity="0.6"/>
  <ellipse cx="125" cy="175" rx="10" ry="6" fill="#1E3A5F" opacity="0.6"/>
  
  <line x1="100" y1="75" x2="100" y2="110" stroke="#1E3A5F" stroke-width="3"/>
</svg>