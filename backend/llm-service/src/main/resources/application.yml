server:
  port: 8087

spring:
  application:
    name: llm-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

anthropic:
  api-key: ${ANTHROPIC_API_KEY:any-key}
  base-url: ${ANTHROPIC_BASE_URL:http://localhost:15721}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.yimi.ai.llm: DEBUG