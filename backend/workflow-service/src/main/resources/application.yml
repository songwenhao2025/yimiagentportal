server:
  port: 8084

spring:
  application:
    name: workflow-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/yimi_ai_portal?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

logging:
  level:
    com.yimi.ai: DEBUG
    org.springframework: INFO

# Internal service URLs
agent:
  service:
    url: http://localhost:8082

skill:
  service:
    url: http://localhost:8083